<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780"
     viewBox="0 0 1500 780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" role="img"
     aria-label="通算重叠的通用模式：取数据、处理、送出三级错位重叠，重叠的永远是不同数据；CPU 预取、CUDA 双缓冲、训练流水线、DeepEP 是同一套路的四个实例">
<title>通算重叠的通用模式</title>
<defs><style>
  .t-title { font-size:30px; font-weight:700; fill:#16202B; text-anchor:middle; }
  .t-sub   { font-size:16px; fill:#4A5A6A; text-anchor:middle; }
  .t-panel { font-size:20px; font-weight:700; fill:#16202B; text-anchor:middle; }
  .t-lane  { font-size:14px; font-weight:700; fill:#4A5A6A; text-anchor:end; }
  .t-bar   { font-size:11px; fill:#FFFFFF; text-anchor:middle; font-weight:600; }
  .t-cap   { font-size:14px; fill:#4A5A6A; text-anchor:middle; }
  .t-cell  { font-size:15px; fill:#4A5A6A; }
  .t-bold  { font-size:15px; font-weight:700; fill:#16202B; }
</style></defs>
<rect width="1500" height="780" fill="#FBFCFE"/><text class="t-title" x="750.0" y="46">通算重叠的通用模式</text><text class="t-sub" x="750.0" y="76">把“等数据”的空档，藏进“处理别的数据”的时间里 —— 重叠的永远是不同数据</text><rect x="80" y="100" width="1360" height="310" rx="14" fill="#EEF3FA" stroke="#C9D6E6"/><text class="t-panel" x="760" y="130">抽象流水线：取数据 → 处理 → 送出，三级错位</text><text class="t-lane" x="330" y="215">取数据 Fetch</text><rect x="380" y="195" width="55" height="30" rx="5" fill="#E08A1E"/><text class="t-bar" x="407.5" y="215">f0</text><rect x="435" y="195" width="55" height="30" rx="5" fill="#E08A1E"/><text class="t-bar" x="462.5" y="215">f1</text><rect x="490" y="195" width="55" height="30" rx="5" fill="#E08A1E"/><text class="t-bar" x="517.5" y="215">f2</text><rect x="545" y="195" width="55" height="30" rx="5" fill="#E08A1E"/><text class="t-bar" x="572.5" y="215">f3</text><rect x="600" y="195" width="55" height="30" rx="5" fill="#E08A1E"/><text class="t-bar" x="627.5" y="215">f4</text><text class="t-lane" x="330" y="275">处理 Process</text><rect x="435" y="255" width="55" height="30" rx="5" fill="#4C9BE8"/><text class="t-bar" x="462.5" y="275">p0</text><rect x="490" y="255" width="55" height="30" rx="5" fill="#4C9BE8"/><text class="t-bar" x="517.5" y="275">p1</text><rect x="545" y="255" width="55" height="30" rx="5" fill="#4C9BE8"/><text class="t-bar" x="572.5" y="275">p2</text><rect x="600" y="255" width="55" height="30" rx="5" fill="#4C9BE8"/><text class="t-bar" x="627.5" y="275">p3</text><rect x="655" y="255" width="55" height="30" rx="5" fill="#4C9BE8"/><text class="t-bar" x="682.5" y="275">p4</text><text class="t-lane" x="330" y="335">送出 Send</text><rect x="490" y="315" width="55" height="30" rx="5" fill="#7A4FA8"/><text class="t-bar" x="517.5" y="335">s0</text><rect x="545" y="315" width="55" height="30" rx="5" fill="#7A4FA8"/><text class="t-bar" x="572.5" y="335">s1</text><rect x="600" y="315" width="55" height="30" rx="5" fill="#7A4FA8"/><text class="t-bar" x="627.5" y="335">s2</text><rect x="655" y="315" width="55" height="30" rx="5" fill="#7A4FA8"/><text class="t-bar" x="682.5" y="335">s3</text><rect x="710" y="315" width="55" height="30" rx="5" fill="#7A4FA8"/><text class="t-bar" x="737.5" y="335">s4</text><line x1="520" y1="185" x2="520" y2="350" stroke="#16202B" stroke-width="2" stroke-dasharray="5 4"/><text x="520" y="382" text-anchor="middle" font-size="14" font-weight="600" fill="#16202B">此刻：f2 ∥ p1 ∥ s0 —— 三份不同数据</text><rect x="80" y="430" width="1360" height="310" rx="14" fill="#EEF3FA" stroke="#C9D6E6"/><text class="t-panel" x="760" y="460">同一个套路，四套说辞 —— 映射到具体系统</text><text class="t-bold" x="150" y="498">场景</text><text class="t-bold" x="460" y="498">重叠对（正在处理 A ∥ 同时搬运 B）</text><rect x="120" y="512" width="1280" height="50" rx="8" fill="#FFFFFF"/><rect x="138" y="528" width="12" height="18" rx="3" fill="#E08A1E"/><text class="t-bold" x="164" y="542">CPU 预取</text><text class="t-cell" x="460" y="542">执行当前指令 ∥ 预取下一条指令 / 数据</text><rect x="120" y="572" width="1280" height="50" rx="8" fill="#F2F6FB"/><rect x="138" y="588" width="12" height="18" rx="3" fill="#4C9BE8"/><text class="t-bold" x="164" y="602">CUDA 双缓冲</text><text class="t-cell" x="460" y="602">stream B 计算当前帧 ∥ stream A 拷入下一帧</text><rect x="120" y="632" width="1280" height="50" rx="8" fill="#FFFFFF"/><rect x="138" y="648" width="12" height="18" rx="3" fill="#4C9BE8"/><text class="t-bold" x="164" y="662">训练流水线</text><text class="t-cell" x="460" y="662">backward(mb[i]) ∥ forward(mb[i+1])</text><rect x="120" y="692" width="1280" height="50" rx="8" fill="#F2F6FB"/><rect x="138" y="708" width="12" height="18" rx="3" fill="#7A4FA8"/><text class="t-bold" x="164" y="722">DeepEP（MoE）</text><text class="t-cell" x="460" y="722">FFN(mb[i]) ∥ dispatch(mb[i+1])；FFN(mb[i]) ∥ combine(mb[i-1])</text><text class="t-cap" x="760" y="724">共同点：把“数据还没到”的空档，用“处理另一份数据”填上 —— 这就是 overlap 的秘密。</text></svg>
