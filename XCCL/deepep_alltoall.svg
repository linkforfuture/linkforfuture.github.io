<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040"
     viewBox="0 0 1500 1040" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" role="img"
     aria-label="DeepEP 优化 MoE all-to-all：SM 分区让通信只占 4 到 6 个 SM；通信与计算跨 micro-batch 错位重叠，通信从串行停顿变成隐藏成本">
<title>DeepEP 如何优化 MoE 的 All-to-All</title>
<defs><style>
  .t-title { font-size:30px; font-weight:700; fill:#16202B; text-anchor:middle; }
  .t-sub   { font-size:16px; fill:#4A5A6A; text-anchor:middle; }
  .t-panel { font-size:20px; font-weight:700; fill:#16202B; text-anchor:middle; }
  .t-note  { font-size:13px; fill:#4A5A6A; }
  .t-cap   { font-size:14px; fill:#4A5A6A; text-anchor:middle; }
</style></defs>
<rect width="1500" height="1040" fill="#FBFCFE"/><text class="t-title" x="750.0" y="46">DeepEP 如何优化 MoE 的 All-to-All</text><text class="t-sub" x="750.0" y="76">通信只占 4~6 个 SM，并跨 micro-batch 与计算错位重叠 —— 把 all-to-all 藏进专家计算的“阴影”里</text><rect x="80" y="100" width="1360" height="320" rx="14" fill="#EEF3FA" stroke="#C9D6E6"/><text class="t-panel" x="760" y="128">背景：MoE 的 all-to-all = dispatch（前向）+ combine（反向）</text><text class="t-cap" x="760" y="150">4 卡 EP（每卡 3 个专家）：token 按路由发给专家所在卡；专家算完把结果收回原卡并求和。以 GPU0 为例 ↓</text><text x="104" y="188" font-size="15" font-weight="700" fill="#16202B">① dispatch（前向）</text><rect x="104" y="196" width="200" height="78" rx="10" fill="#1F2A36" stroke="#3B4C5E"/><text x="118" y="226" font-size="19" font-weight="700" fill="#DCE6F0">GPU 0</text><text x="118" y="252" font-size="12" fill="#8FA3B8">专家 E0 / E4 / E8</text><rect x="364" y="196" width="200" height="78" rx="10" fill="#1F2A36" stroke="#3B4C5E"/><text x="378" y="226" font-size="19" font-weight="700" fill="#DCE6F0">GPU 1</text><text x="378" y="252" font-size="12" fill="#8FA3B8">专家 E1 / E5 / E9</text><rect x="624" y="196" width="200" height="78" rx="10" fill="#1F2A36" stroke="#3B4C5E"/><text x="638" y="226" font-size="19" font-weight="700" fill="#DCE6F0">GPU 2</text><text x="638" y="252" font-size="12" fill="#8FA3B8">专家 E2 / E6 / E10</text><rect x="884" y="196" width="200" height="78" rx="10" fill="#1F2A36" stroke="#3B4C5E"/><text x="898" y="226" font-size="19" font-weight="700" fill="#DCE6F0">GPU 3</text><text x="898" y="252" font-size="12" fill="#8FA3B8">专家 E3 / E7 / E11</text><line x1="304" y1="214" x2="364" y2="214" stroke="#258A50" stroke-width="3" marker-end="url(#arr258A50)"/><line x1="304" y1="234" x2="624" y2="234" stroke="#C87F1C" stroke-width="3" marker-end="url(#arrC87F1C)"/><line x1="304" y1="254" x2="884" y2="254" stroke="#7A4FA8" stroke-width="3" marker-end="url(#arr7A4FA8)"/><text x="470" y="205" font-size="12" fill="#4A5A6A">token 按路由 → 专家所在卡</text><text x="470" y="248" font-size="12" fill="#8FA3B8">数据量每对卡都不同（alltoallv）</text><text x="104" y="308" font-size="15" font-weight="700" fill="#16202B">② combine（反向）</text><line x1="364" y1="336" x2="304" y2="336" stroke="#9AA7B5" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrg)"/><text x="334" y="332" font-size="11" fill="#9AA7B5" text-anchor="end">Σ 求和</text><line x1="624" y1="356" x2="304" y2="356" stroke="#9AA7B5" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrg)"/><text x="594" y="352" font-size="11" fill="#9AA7B5" text-anchor="end">Σ 求和</text><line x1="884" y1="376" x2="304" y2="376" stroke="#9AA7B5" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrg)"/><text x="854" y="372" font-size="11" fill="#9AA7B5" text-anchor="end">Σ 求和</text><text x="470" y="326" font-size="12" fill="#4A5A6A">各专家的部分结果收回原卡</text><text x="470" y="376" font-size="12" fill="#4A5A6A">同一 token 的多个部分结果相加</text><rect x="1140" y="196" width="280" height="200" rx="10" fill="#FBFCFE" stroke="#C9D6E6"/><text x="1160" y="222" font-size="14" font-weight="700" fill="#16202B">通信路径</text><text x="1160" y="250" font-size="13" fill="#4A5A6A">机内（同节点）→ NVLink</text><text x="1160" y="274" font-size="13" fill="#4A5A6A">机间（跨节点）→ RDMA</text><text x="1160" y="298" font-size="13" fill="#4A5A6A">跨机：先 NVLink 跳到目标节点</text><text x="1160" y="318" font-size="13" fill="#4A5A6A">再 RDMA 出网（两阶段转发）</text><text x="1160" y="342" font-size="13" fill="#4A5A6A">dispatch 传 FP8，带宽减半</text><text x="1160" y="370" font-size="12" fill="#8FA3B8">零拷贝：NVLink 直读对方显存，</text><text x="1160" y="386" font-size="12" fill="#8FA3B8">数据不经过 host / 临时 buffer</text><rect x="80" y="440" width="740" height="360" rx="14" fill="#EEF3FA" stroke="#C9D6E6"/><text class="t-panel" x="450" y="468">优化①　SM 分区：通信只占 4~6 个 SM</text><rect x="110" y="492" width="440" height="200" rx="12" fill="#1F2A36" stroke="#3B4C5E"/><text x="130" y="518" font-size="15" font-weight="700" fill="#DCE6F0">GPU（示意，≈100+ 个 SM）</text><rect x="150" y="536" width="22" height="20" rx="3.5" fill="#E08A1E"/><rect x="177" y="536" width="22" height="20" rx="3.5" fill="#E08A1E"/><rect x="204" y="536" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="231" y="536" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="258" y="536" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="285" y="536" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="312" y="536" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="339" y="536" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="366" y="536" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="393" y="536" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="420" y="536" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="447" y="536" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="150" y="561" width="22" height="20" rx="3.5" fill="#E08A1E"/><rect x="177" y="561" width="22" height="20" rx="3.5" fill="#E08A1E"/><rect x="204" y="561" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="231" y="561" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="258" y="561" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="285" y="561" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="312" y="561" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="339" y="561" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="366" y="561" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="393" y="561" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="420" y="561" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="447" y="561" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="150" y="586" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="177" y="586" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="204" y="586" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="231" y="586" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="258" y="586" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="285" y="586" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="312" y="586" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="339" y="586" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="366" y="586" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="393" y="586" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="420" y="586" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="447" y="586" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="150" y="611" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="177" y="611" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="204" y="611" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="231" y="611" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="258" y="611" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="285" y="611" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="312" y="611" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="339" y="611" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="366" y="611" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="393" y="611" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="420" y="611" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="447" y="611" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="150" y="636" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="177" y="636" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="204" y="636" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="231" y="636" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="258" y="636" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="285" y="636" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="312" y="636" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="339" y="636" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="366" y="636" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="393" y="636" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="420" y="636" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="447" y="636" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="150" y="661" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="177" y="661" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="204" y="661" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="231" y="661" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="258" y="661" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="285" y="661" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="312" y="661" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="339" y="661" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="366" y="661" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="393" y="661" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="420" y="661" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="447" y="661" width="22" height="20" rx="3.5" fill="#4C9BE8"/><rect x="130" y="700" width="16" height="16" rx="3" fill="#E08A1E"/><text x="152" y="713" font-size="13" fill="#4A5A6A">通信 SM ×4（DeepEP dispatch/combine）</text><rect x="400" y="700" width="16" height="16" rx="3" fill="#4C9BE8"/><text x="422" y="713" font-size="13" fill="#4A5A6A">计算 SM（专家 FFN）</text><line x1="92" y1="596" x2="110" y2="596" stroke="#16202B" stroke-width="2.5" marker-end="url(#nArr)"/><text x="60" y="586" font-size="12" fill="#4A5A6A">token 流入</text><line x1="550" y1="556" x2="592" y2="556" stroke="#258A50" stroke-width="2.5" marker-end="url(#nArrB)"/><text x="560" y="546" font-size="12" fill="#4A5A6A">dispatch 发出</text><line x1="592" y1="636" x2="550" y2="636" stroke="#9AA7B5" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrg)"/><text x="560" y="656" font-size="12" fill="#4A5A6A">combine 收回</text><text x="580" y="510" font-size="14" font-weight="700" fill="#16202B">为什么快</text><text x="580" y="536" font-size="13" fill="#4A5A6A">普通 all-to-all：占满全部 SM</text><text x="580" y="558" font-size="13" fill="#4A5A6A">→ 通信期间算力闲置</text><text x="580" y="586" font-size="13" font-weight="600" fill="#E08A1E">DeepEP：通信只用 4~6 个 SM</text><text x="580" y="608" font-size="13" fill="#4A5A6A">→ 其余 SM 全给专家 FFN</text><text x="580" y="630" font-size="13" fill="#4A5A6A">→ 同一张卡内两个 kernel 并发</text><text x="580" y="662" font-size="12" fill="#8FA3B8">V2 实测：SM 占用 24 → 4~6，</text><text x="580" y="680" font-size="12" fill="#8FA3B8">性能不降反升，峰值约 1.3×</text><text x="580" y="730" font-size="12" fill="#8FA3B8">SM 数是权衡点：给多了抢计算，</text><text x="580" y="748" font-size="12" fill="#8FA3B8">给少了通信带宽不足；V2 用</text><text x="580" y="766" font-size="12" fill="#8FA3B8">解析建模自动平衡。</text><rect x="840" y="440" width="580" height="360" rx="14" fill="#EEF3FA" stroke="#C9D6E6"/><text class="t-panel" x="1130" y="468">优化②　通信与计算重叠（不同数据）</text><line x1="980" y1="505" x2="1400" y2="505" stroke="#16202B" stroke-width="2" marker-end="url(#nArr)"/><text x="1190" y="496" text-anchor="middle" font-size="12" fill="#4A5A6A">时间 →</text><text x="980" y="542" font-size="15" font-weight="700" fill="#16202B">朴素（NCCL alltoallv）：串行</text><rect x="980" y="552" width="140" height="26" rx="4" fill="#C0504D"/><text x="1050" y="570" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">alltoall mb0</text><rect x="1260" y="552" width="140" height="26" rx="4" fill="#C0504D"/><text x="1330" y="570" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">alltoall mb1</text><rect x="1120" y="598" width="140" height="26" rx="4" fill="#4C9BE8"/><text x="1190" y="616" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="600">FFN mb0</text><rect x="980" y="598" width="140" height="26" rx="4" fill="none" stroke="#C0504D" stroke-dasharray="5 4"/><text x="1050" y="616" text-anchor="middle" font-size="12" fill="#C0504D" font-weight="600">空闲</text><rect x="1260" y="598" width="140" height="26" rx="4" fill="none" stroke="#C0504D" stroke-dasharray="5 4"/><text x="1330" y="616" text-anchor="middle" font-size="12" fill="#C0504D" font-weight="600">空闲</text><text x="980" y="648" font-size="11" fill="#8FA3B8">通信占满 GPU → 通信时计算空转、计算时通信空转</text><text x="980" y="680" font-size="15" font-weight="700" fill="#16202B">DeepEP：跨 micro-batch 错位重叠</text><text x="980" y="704" font-size="11" fill="#8FA3B8">通信</text><text x="980" y="749" font-size="11" fill="#8FA3B8">计算</text><rect x="1200" y="690" width="100" height="24" rx="4" fill="#E08A1E"/><text x="1250" y="707" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">dispatch mb1</text><rect x="1300" y="690" width="100" height="24" rx="4" fill="#7A4FA8"/><text x="1350" y="707" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="600">combine mb0</text><rect x="1050" y="732" width="190" height="24" rx="4" fill="#4C9BE8"/><text x="1145" y="749" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">FFN mb0</text><rect x="1310" y="732" width="90" height="24" rx="4" fill="#4C9BE8"/><text x="1355" y="749" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="600">FFN mb1</text><text x="1220" y="718" text-anchor="middle" font-size="14" fill="#258A50">▲</text><text x="1355" y="718" text-anchor="middle" font-size="14" fill="#258A50">▲</text><text x="980" y="778" font-size="12" fill="#4A5A6A">依赖：FFN(mb0) 只用 dispatch(mb0) 的结果（早已搬完）；此刻通信搬的是别的 mb 的数据。</text><text x="980" y="796" font-size="12" fill="#4A5A6A">调度约束：dispatch(mb1) 必须先于 FFN(mb1)；combine(mb0) 必须晚于 FFN(mb0) —— 图中均满足。</text><rect x="80" y="830" width="1360" height="150" rx="14" fill="#EEF3FA" stroke="#C9D6E6"/><text class="t-panel" x="760" y="856">其余优化</text><rect x="120" y="872" width="400" height="90" rx="10" fill="#FBFCFE" stroke="#C9D6E6"/><text x="136" y="898" font-size="15" font-weight="700" fill="#16202B">③ 零拷贝 / 直访显存</text><text x="136" y="922" font-size="12" fill="#4A5A6A">NVLink 直接读写对方 GPU 显存，数据不</text><text x="136" y="941" font-size="12" fill="#4A5A6A">经过 host、不复制到临时 buffer；V2</text><text x="136" y="960" font-size="12" fill="#4A5A6A"> 进一步去掉 tensor 与通信 buffer</text><text x="136" y="979" font-size="12" fill="#4A5A6A"> 之间的拷贝，SM 占用也随之下降。</text><rect x="555" y="872" width="400" height="90" rx="10" fill="#FBFCFE" stroke="#C9D6E6"/><text x="571" y="898" font-size="15" font-weight="700" fill="#16202B">④ NVLink + RDMA 各司其职</text><text x="571" y="922" font-size="12" fill="#4A5A6A">机内走 NVLink（Blackwell 实测 </text><text x="571" y="941" font-size="12" fill="#4A5A6A">~726 GB/s），机间走 RDMA；跨机 t</text><text x="571" y="960" font-size="12" fill="#4A5A6A">oken 先 NVLink 跳到目标节点再 RD</text><text x="571" y="979" font-size="12" fill="#4A5A6A">MA 出网。V2 换用更轻量的 NCCL Gin</text><text x="571" y="998" font-size="12" fill="#4A5A6A"> 后端。</text><rect x="990" y="872" width="400" height="90" rx="10" fill="#FBFCFE" stroke="#C9D6E6"/><text x="1006" y="898" font-size="15" font-weight="700" fill="#16202B">⑤ FP8 + 低延迟 kernel</text><text x="1006" y="922" font-size="12" fill="#4A5A6A">dispatch 直接传 FP8 数据，带宽减半</text><text x="1006" y="941" font-size="12" fill="#4A5A6A">；decode 场景用低延迟 kernel，一次</text><text x="1006" y="960" font-size="12" fill="#4A5A6A"> all-to-all 仅 100~200 μs</text><text x="1006" y="979" font-size="12" fill="#4A5A6A">，并缓存路由元数据省掉 CPU 同步。</text><text class="t-cap" x="760" y="1015" font-size="15" font-weight="600" fill="#16202B">一句话：DeepEP 没减少 all-to-all 要搬的数据量，而是用 SM 分区 + 异步流，把通信压到 4~6 个 SM 上、并跨 micro-batch 与计算错位重叠 —— 通信从“串行停顿”变成“隐藏成本”。</text>
<defs>
