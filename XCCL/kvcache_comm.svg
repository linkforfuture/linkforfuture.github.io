<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="985"
     viewBox="0 0 1500 985" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" role="img"
     aria-label="KV Cache 通信加速全景图：载荷特殊性（大、持久、延迟双相、有序、可压缩），三条加速轴（搬得快、少搬、重叠），三个通信形态（分离式、上下文并行、池化）">
<title>KV Cache 通信加速全景图</title>
<defs><style>
  .t-title { font-size:30px; font-weight:700; fill:#16202B; text-anchor:middle; }
  .t-sub   { font-size:15px; fill:#4A5A6A; text-anchor:middle; }
  .t-panel { font-size:20px; font-weight:700; fill:#16202B; text-anchor:middle; }
  .t-card  { font-size:15px; font-weight:700; fill:#16202B; }
  .t-body  { font-size:12px; fill:#4A5A6A; }
  .t-dim   { font-size:11px; fill:#8FA3B8; }
  .t-axis  { font-size:14px; font-weight:700; fill:#FFFFFF; text-anchor:middle; }
  .t-tag   { font-size:11px; fill:#4A5A6A; text-anchor:middle; }
  .t-block { font-size:17px; font-weight:700; fill:#16202B; }
  .t-chip  { font-size:11px; font-weight:600; fill:#FFFFFF; text-anchor:middle; }
  .t-bull  { font-size:13px; fill:#4A5A6A; }
  .t-ins   { font-size:12px; fill:#8FA3B8; }
  .t-foot  { font-size:14px; fill:#4A5A6A; text-anchor:middle; }
</style></defs>
<rect width="1500" height="985" fill="#FBFCFE"/><text class="t-title" x="750.0" y="46">KV Cache 通信加速全景图</text><text class="t-sub" x="750.0" y="76">KV cache 是通信原语在推理侧最高价值的载荷 —— 搬得快 · 少搬 · 重叠</text><rect x="70" y="110" width="350" height="820" rx="14" fill="#EEF3FA" stroke="#C9D6E6"/><text class="t-panel" x="245" y="142">KV cache 作为通信载荷</text><rect x="90" y="165" width="310" height="130" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="90" y="165" width="8" height="130" rx="4" fill="#4C9BE8"/><text class="t-card" x="110" y="193">① 大</text><text class="t-body" x="110" y="219">GB 级 / 请求（上下文 × 层 × KV head）</text><text class="t-body" x="110" y="241">→ 带宽主导</text><text class="t-dim" x="110" y="273">128K 上下文 ≈ 40 GB</text><rect x="90" y="309" width="310" height="130" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="90" y="309" width="8" height="130" rx="4" fill="#258A50"/><text class="t-card" x="110" y="337">② 持久</text><text class="t-body" x="110" y="363">陪完整条请求的 decode 全程</text><text class="t-body" x="110" y="385">→ 值得专门优化</text><rect x="90" y="453" width="310" height="130" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="90" y="453" width="8" height="130" rx="4" fill="#E08A1E"/><text class="t-card" x="110" y="481">③ 延迟双相</text><text class="t-body" x="110" y="507">首包决定 TTFT，整体决定吞吐</text><text class="t-body" x="110" y="529">→ 一条传输，两个瓶颈</text><rect x="90" y="597" width="310" height="130" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="90" y="597" width="8" height="130" rx="4" fill="#7A4FA8"/><text class="t-card" x="110" y="625">④ 有序</text><text class="t-body" x="110" y="651">按 position 排列</text><text class="t-body" x="110" y="673">→ 可流式 / 分块 / 管道化</text><rect x="90" y="741" width="310" height="130" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="90" y="741" width="8" height="130" rx="4" fill="#2BA49B"/><text class="t-card" x="110" y="769">⑤ 可压缩</text><text class="t-body" x="110" y="795">FP8 · MLA latent · delta 编码</text><text class="t-body" x="110" y="817">→ 源头做小，通信自然快</text><text class="t-panel" x="245" y="896" font-size="15">→ 持久载荷 + 流式 + 压缩的通信问题</text><text x="585" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#16202B">三条加速轴</text><rect x="540" y="261" width="90" height="28" rx="14" fill="#4C9BE8"/><text class="t-axis" x="585" y="280">搬得快</text><line x1="460" y1="291" x2="710" y2="291" stroke="#4C9BE8" stroke-width="3" marker-end="url(#ma4C9BE8)"/><text class="t-tag" x="585" y="319">零拷贝 RDMA · 多 NIC 聚合</text><text class="t-tag" x="585" y="337">拓扑选路 · GPUDirect</text><rect x="540" y="516" width="90" height="28" rx="14" fill="#258A50"/><text class="t-axis" x="585" y="535">少搬</text><line x1="460" y1="546" x2="710" y2="546" stroke="#258A50" stroke-width="3" marker-end="url(#ma258A50)"/><text class="t-tag" x="585" y="574">压缩 FP8 / MLA / delta</text><text class="t-tag" x="585" y="592">前缀复用 · 搬 Q 不搬 KV</text><rect x="540" y="771" width="90" height="28" rx="14" fill="#E08A1E"/><text class="t-axis" x="585" y="790">重叠</text><line x1="460" y1="801" x2="710" y2="801" stroke="#E08A1E" stroke-width="3" marker-end="url(#maE08A1E)"/><text class="t-tag" x="585" y="829">与 decode / attention 计算重叠</text><text class="t-tag" x="585" y="847">分块流式 · 管道化</text><rect x="750" y="110" width="680" height="820" rx="14" fill="#EEF3FA" stroke="#C9D6E6"/><text class="t-panel" x="1090" y="142">三个通信形态 + 各自加速</text><rect x="770" y="165" width="640" height="240" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="770" y="165" width="6" height="240" rx="3" fill="#4C9BE8"/><text class="t-block" x="792" y="199">① 分离式 prefill → decode</text><rect x="1220" y="183" width="175" height="26" rx="13" fill="#4C9BE8"/><text class="t-chip" x="1307" y="200">p2p · RDMA write · scatter</text><text x="792" y="239" font-size="12" font-weight="700" fill="#8FA3B8">加速：</text><text class="t-bull" x="812" y="265">· 零拷贝 GPUDirect RDMA + 多 NIC 带宽聚合</text><text class="t-bull" x="812" y="293">· 首包走低延迟路径（定 TTFT），整体走高吞吐路径</text><text class="t-bull" x="812" y="321">· 分块流式 + 与 decode 计算重叠（不同请求）</text><line x1="792" y1="361" x2="1390" y2="361" stroke="#E2E8F0"/><text class="t-ins" x="792" y="385">实例：Mooncake Transfer Engine · vLLM MooncakeConnector</text><rect x="770" y="419" width="640" height="240" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="770" y="419" width="6" height="240" rx="3" fill="#E08A1E"/><text class="t-block" x="792" y="453">② 上下文并行（Ring Attention）</text><rect x="1220" y="437" width="175" height="26" rx="13" fill="#E08A1E"/><text class="t-chip" x="1307" y="454">环上 p2p send / recv</text><text x="792" y="493" font-size="12" font-weight="700" fill="#8FA3B8">加速：</text><text class="t-bull" x="812" y="519">· KV 传输与 attention 计算重叠</text><text class="t-bull" x="812" y="547">· pass-KV vs pass-Q：搬小的一边（KV 命中高时搬 Q）</text><text class="t-bull" x="812" y="575">· zigzag 分区做负载均衡，隐藏通信</text><line x1="792" y1="615" x2="1390" y2="615" stroke="#E2E8F0"/><text class="t-ins" x="792" y="639">实例：Ring Attention / Context Parallelism（百万级上下文）</text><rect x="770" y="673" width="640" height="240" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="770" y="673" width="6" height="240" rx="3" fill="#7A4FA8"/><text class="t-block" x="792" y="707">③ 池化（KV 远端存储）</text><rect x="1220" y="691" width="175" height="26" rx="13" fill="#7A4FA8"/><text class="t-chip" x="1307" y="708">RMA 远端读写 · 存储式</text><text x="792" y="747" font-size="12" font-weight="700" fill="#8FA3B8">加速：</text><text class="t-bull" x="812" y="773">· 拓扑感知选路 + 自动 failover（RDMA→TCP 自愈）</text><text class="t-bull" x="812" y="801">· 前缀复用：多请求共享同一段 KV，免重算</text><text class="t-bull" x="812" y="829">· 跨层缓存 device → host → remote（如 HiCache）</text><line x1="792" y1="869" x2="1390" y2="869" stroke="#E2E8F0"/><text class="t-ins" x="792" y="893">实例：Mooncake Store · SGLang HiCache</text><text class="t-foot" x="760" y="964" font-weight="600" fill="#16202B">加速点不只是“搬得快” —— 少搬（压缩 / 复用）与重叠（藏进计算）同样关键。</text><defs><marker id="ma4C9BE8" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4C9BE8"/></marker><marker id="ma258A50" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#258A50"/></marker><marker id="maE08A1E" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#E08A1E"/></marker></defs></svg>
