<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920"
     viewBox="0 0 1500 920" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" role="img"
     aria-label="Prefill 与 Decode 概念：一次请求的生命周期中，Prefill 并行处理整段 prompt 并产出 KV cache，Decode 逐 token 生成并每步读取 KV cache">
<title>Prefill · Decode · KV Cache 概念</title>
<defs><style>
  .t-title { font-size:30px; font-weight:700; fill:#16202B; text-anchor:middle; }
  .t-sub   { font-size:15px; fill:#4A5A6A; text-anchor:middle; }
  .t-panel { font-size:20px; font-weight:700; fill:#16202B; text-anchor:middle; }
  .t-node  { font-size:15px; font-weight:700; fill:#FFFFFF; text-anchor:middle; }
  .t-node2 { font-size:12px; fill:#EAF2FB; text-anchor:middle; }
  .t-nodeD { font-size:15px; font-weight:700; fill:#16202B; text-anchor:middle; }
  .t-nodeD2{ font-size:12px; fill:#8FA3B8; text-anchor:middle; }
  .t-arrlbl { font-size:12px; fill:#4A5A6A; text-anchor:middle; }
  .t-cap   { font-size:14px; fill:#4A5A6A; text-anchor:middle; }
  .t-cardh { font-size:17px; font-weight:700; fill:#FFFFFF; }
  .t-cards { font-size:12px; fill:#EAF2FB; }
  .t-fact  { font-size:13px; fill:#4A5A6A; }
</style></defs>
<rect width="1500" height="920" fill="#FBFCFE"/><text class="t-title" x="750.0" y="46">Prefill · Decode · KV Cache 概念</text><text class="t-sub" x="750.0" y="76">一次请求分两段：Prefill 并行算完 prompt 并产出 KV cache；Decode 逐 token 生成，每步读 KV cache</text><rect x="80" y="100" width="1360" height="310" rx="14" fill="#EEF3FA" stroke="#C9D6E6"/><text class="t-panel" x="760" y="130">一次请求的生命周期：Prefill 产出 KV cache，Decode 消费它</text><rect x="100" y="170" width="140" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><text class="t-nodeD" x="170" y="200">用户 prompt</text><text class="t-nodeD2" x="170" y="222">（N 个 token）</text><rect x="310" y="170" width="170" height="70" rx="10" fill="#4C9BE8"/><text class="t-node" x="395" y="198">Prefill 阶段</text><text class="t-node2" x="395" y="218">并行算整段 · 计算密集</text><rect x="880" y="170" width="170" height="70" rx="10" fill="#E08A1E"/><text class="t-node" x="965" y="198">Decode 阶段</text><text class="t-node2" x="965" y="218">逐 token 生成 · 访存密集</text><rect x="1130" y="170" width="270" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/><text class="t-nodeD" x="1265" y="200">逐 token 返回用户</text><text class="t-nodeD2" x="1265" y="222">延迟敏感（TTFT / ITL）</text><line x1="240" y1="205" x2="310" y2="205" stroke="#16202B" stroke-width="2.5" marker-end="url(#nArr)"/><line x1="480" y1="205" x2="880" y2="205" stroke="#16202B" stroke-width="2.5" marker-end="url(#nArr)"/><text class="t-arrlbl" x="680" y="195">移交 首 token + KV cache</text><line x1="1050" y1="205" x2="1130" y2="205" stroke="#16202B" stroke-width="2.5" marker-end="url(#nArr)"/><rect x="560" y="300" width="230" height="80" rx="12" fill="#7A4FA8"/><text class="t-node" x="675" y="333" font-size="17">KV cache</text><text class="t-node2" x="675" y="356">本请求的 K/V 记录</text><line x1="395" y1="240" x2="620" y2="300" stroke="#7A4FA8" stroke-width="2.5" marker-end="url(#mP)"/><text class="t-arrlbl" x="485" y="280">产出 KV cache</text><path d="M 790 340 C 840 320, 880 300, 900 242" fill="none" stroke="#E08A1E" stroke-width="2.5" marker-end="url(#mO)"/><text class="t-arrlbl" x="850" y="318">每步读取</text><text class="t-cap" x="760" y="392">为什么缓存 K/V：decode 每步都要对全部历史做 attention —— 缓存住就免去每步重算整段历史（每步成本从 O(seq·layers) 的重复计算变成一次读缓存）</text><rect x="80" y="430" width="1360" height="450" rx="14" fill="#EEF3FA" stroke="#C9D6E6"/><text class="t-panel" x="760" y="462">三张概念卡</text><rect x="105" y="490" width="400" height="330" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="105" y="490" width="400" height="62" rx="12" fill="#4C9BE8"/><rect x="105" y="530" width="400" height="22" fill="#4C9BE8"/><text class="t-cardh" x="125" y="518">① Prefill（预填充）</text><text class="t-cards" x="125" y="540">处理整段 prompt</text><text class="t-fact" x="125" y="588"><tspan font-weight="700" fill="#4C9BE8">输入：</tspan>整段 prompt，N 个 token 并行</text><text class="t-fact" x="125" y="632"><tspan font-weight="700" fill="#4C9BE8">计算：</tspan>一次算所有 token 的注意力（GEMM 密集）</text><text class="t-fact" x="125" y="676"><tspan font-weight="700" fill="#4C9BE8">资源：</tspan>计算密集 · 突发式到达</text><text class="t-fact" x="125" y="720"><tspan font-weight="700" fill="#4C9BE8">产出：</tspan>第一个 token + 本请求的 KV cache</text><text class="t-fact" x="125" y="764"><tspan font-weight="700" fill="#4C9BE8">指标：</tspan>TTFT（首 token 延迟）</text><rect x="550" y="490" width="400" height="330" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="550" y="490" width="400" height="62" rx="12" fill="#E08A1E"/><rect x="550" y="530" width="400" height="22" fill="#E08A1E"/><text class="t-cardh" x="570" y="518">② Decode（自回归生成）</text><text class="t-cards" x="570" y="540">一个 token 一个 token 地出</text><text class="t-fact" x="570" y="588"><tspan font-weight="700" fill="#E08A1E">输入：</tspan>上一步刚生成的 1 个 token</text><text class="t-fact" x="570" y="632"><tspan font-weight="700" fill="#E08A1E">计算：</tspan>1 个新 q 对全部历史 K/V 做注意力</text><text class="t-fact" x="570" y="676"><tspan font-weight="700" fill="#E08A1E">资源：</tspan>访存密集 · 每步读几 GB KV</text><text class="t-fact" x="570" y="720"><tspan font-weight="700" fill="#E08A1E">依赖：</tspan>每一步都要读 KV cache</text><text class="t-fact" x="570" y="764"><tspan font-weight="700" fill="#E08A1E">指标：</tspan>ITL / TPOT（token 间隔）</text><rect x="995" y="490" width="400" height="330" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="995" y="490" width="400" height="62" rx="12" fill="#7A4FA8"/><rect x="995" y="530" width="400" height="22" fill="#7A4FA8"/><text class="t-cardh" x="1015" y="518">③ KV Cache（键值缓存）</text><text class="t-cards" x="1015" y="540">prefill 的产物，decode 的口粮</text><text class="t-fact" x="1015" y="588"><tspan font-weight="700" fill="#7A4FA8">是什么：</tspan>本请求各 token 的 K/V，按 请求×位置×层×head</text><text class="t-fact" x="1015" y="632"><tspan font-weight="700" fill="#7A4FA8">为什么：</tspan>免去 decode 每步重算整段历史</text><text class="t-fact" x="1015" y="676"><tspan font-weight="700" fill="#7A4FA8">增长：</tspan>并发 × 上下文长度，与词表无关</text><text class="t-fact" x="1015" y="720"><tspan font-weight="700" fill="#7A4FA8">来源：</tspan>Prefill 产出 · Decode 消费</text><text class="t-fact" x="1015" y="764"><tspan font-weight="700" fill="#7A4FA8">管理：</tspan>淘汰 / 分页 / 前缀复用 / 压缩（MLA·FP8）</text><text class="t-cap" x="760" y="862" font-weight="600" fill="#16202B">Prefill 产出 KV，Decode 消费 KV —— 这就是 KV cache 通信的起源（下一节展开）</text><defs>
<marker id="nArr" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#16202B"/></marker>
<marker id="mP" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7A4FA8"/></marker>
<marker id="mO" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#E08A1E"/></marker>
</defs></svg>
