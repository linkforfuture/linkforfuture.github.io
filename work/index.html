<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工作文档 · Linkforfuture</title>
  <link rel="stylesheet" href="docsify/vue.css">
  <style>
    :root {
      --theme-color: #4f46e5;
      --theme-color-light: #eef0ff;
    }
    .sidebar {
      background: #fafbfc;
    }
    .sidebar > h1 { font-size: 1.15rem; }
    .sidebar-nav a { color: #57606a; }
    .sidebar-nav a:hover { color: #4f46e5; }
    .sidebar-nav li.active > a {
      color: #4f46e5;
      border-right: 2px solid #4f46e5;
    }
    .markdown-section a { color: #4f46e5; }
    .markdown-section code {
      background: #f0f1f4;
      border-radius: 4px;
    }
    .app-nav a:hover { color: #4f46e5; }
  </style>
</head>
<body>
  <div id="app">加载中…</div>
  <script>
    window.$docsify = {
      name: '工作文档',
      nameLink: '/',
      repo: 'linkforfuture/linkforfuture.github.io',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: false,
      themeColor: '#4f46e5',
      search: {
        placeholder: '搜索文档',
        noData: '没有找到结果',
        paths: 'auto',
        depth: 4,
      },
    };
  </script>
  <script src="docsify/docsify.min.js"></script>
  <script src="docsify/prism-core.min.js"></script>
  <script src="docsify/prism-c.min.js"></script>
  <script src="docsify/prism-cpp.min.js"></script>
  <script src="docsify/prism-python.min.js"></script>
  <script src="docsify/prism-bash.min.js"></script>
  <script src="docsify/prism-json.min.js"></script>
  <script src="docsify/prism-markdown.min.js"></script>
  <script src="docsify/search.min.js"></script>
  <script src="docsify/zoom-image.min.js"></script>
</body>
</html>
